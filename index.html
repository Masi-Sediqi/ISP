<!doctype html>
<html lang="en" dir="ltr">
  <head><script>try{const theme=localStorage.getItem('isp-theme')||'dark';if(theme==='dark'||theme==='winter'){document.documentElement.style.colorScheme='dark';document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('dark-mode'),{once:true})}}catch(e){document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('dark-mode'),{once:true})}</script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./brand-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afghan Power</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #f7f5f1;
      }

      body {
        overflow-x: hidden;
        font-family: "Vazirmatn", "Segoe UI", Arial, sans-serif;
      }

      .boot-loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #252525;
      }

      .boot-loading-card {
        width: min(360px, calc(100vw - 40px));
        padding: 28px;
        border: 1px solid #ece8df;
        border-radius: 16px;
        background: #ffffff;
        text-align: center;
        box-shadow: 0 18px 45px rgba(32, 27, 17, 0.08);
      }

      .boot-loading-mark {
        width: 42px;
        height: 42px;
        margin: 0 auto 14px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: #151515;
        color: #ffffff;
        font-weight: 800;
      }

      .boot-loading-card strong {
        display: block;
        margin-bottom: 6px;
        font-size: 18px;
      }

      .boot-loading-card span {
        color: #7b7368;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading">
        <div class="boot-loading-card">
          <div class="boot-loading-mark">I</div>
          <strong>Afghan Power is loading...</strong>
          <span>If this stays here, refresh the page once.</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.jsx"></script>
  </body>
</html>
