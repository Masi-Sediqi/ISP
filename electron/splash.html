<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afghan Power</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }

      .splash {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        padding: 34px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(248, 250, 252, 0.92)),
          url("./assets/ISP.png") center / cover no-repeat;
      }

      .content {
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      .logo {
        width: min(520px, 74vw);
        aspect-ratio: 1;
        object-fit: contain;
        filter: drop-shadow(0 24px 32px rgba(15, 23, 42, 0.18));
      }

      .loader {
        width: 220px;
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.12);
      }

      .loader span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #111827, #94a3b8);
        animation: loading 1.15s ease-in-out infinite;
      }

      body.closing {
        animation: fadeOut 0.36s ease forwards;
      }

      @keyframes loading {
        from {
          transform: translateX(-110%);
        }

        to {
          transform: translateX(270%);
        }
      }

      @keyframes fadeOut {
        to {
          opacity: 0;
          transform: scale(0.985);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <section class="content" aria-label="Afghan Power loading">
        <img class="logo" src="./assets/ISP.png" alt="Afghan Power" />
        <div class="loader"><span></span></div>
      </section>
    </main>

    <script>
      window.require?.("electron")?.ipcRenderer?.on("splash-close", () => {
        document.body.classList.add("closing");
      });
    </script>
  </body>
</html>
